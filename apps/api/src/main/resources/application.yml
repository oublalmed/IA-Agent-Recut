spring:
  application:
    name: ia-recruiter-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ia_recruiter}
    username: ${SPRING_DATASOURCE_USERNAME:ia_recruiter}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme_strong_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:rabbit}
    password: ${SPRING_RABBITMQ_PASSWORD:changeme_rabbit_password}
    virtual-host: ${SPRING_RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
          multiplier: 2.0
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:changeme_minio_secret}
  bucket-resumes: ${MINIO_BUCKET_RESUMES:resumes}

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  model-extraction: ${ANTHROPIC_MODEL_EXTRACTION:claude-haiku-4-5-20251001}
  model-matching: ${ANTHROPIC_MODEL_MATCHING:claude-haiku-4-5-20251001}
  base-url: https://api.anthropic.com
  max-tokens: 4096

app:
  mail:
    from: ${SMTP_FROM:noreply@ia-recruiter.local}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

rabbitmq:
  exchange: ia.recruiter.exchange
  queues:
    resume-extraction: resume.extraction.queue
    candidate-matching: candidate.matching.queue
  routing-keys:
    resume-extraction: resume.extraction.new
    candidate-matching: candidate.matching.new

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
