name: CI — Backend

on:
  push:
    branches: [main, develop, "claude/**"]
    paths: ["apps/api/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["apps/api/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ia_recruiter_test
          POSTGRES_USER: ia_recruiter
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        working-directory: apps/api
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ia_recruiter_test
          SPRING_DATASOURCE_USERNAME: ia_recruiter
          SPRING_DATASOURCE_PASSWORD: testpassword
          JWT_SECRET: dGVzdHNlY3JldGtleWZvcmNpdGVzdGluZ3B1cnBvc2VzMTIz
          ANTHROPIC_API_KEY: dummy-key-for-ci
        run: mvn verify -q

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/api/target/surefire-reports/
