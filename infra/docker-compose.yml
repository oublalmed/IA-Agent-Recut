version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ia_recruiter_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ia_recruiter}
      POSTGRES_USER: ${POSTGRES_USER:-ia_recruiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ia_recruiter} -d ${POSTGRES_DB:-ia_recruiter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ia_net

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: ia_recruiter_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ia_net

  minio-init:
    image: minio/mc:latest
    container_name: ia_recruiter_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-changeme_minio_secret};
        mc mb --ignore-existing local/${MINIO_BUCKET_RESUMES:-resumes};
        mc anonymous set none local/${MINIO_BUCKET_RESUMES:-resumes};
        echo 'MinIO bucket initialized';
      "
    networks:
      - ia_net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ia_recruiter_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme_rabbit_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ia_net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ia_recruiter_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - ia_net

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: ia_recruiter_api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ia_recruiter}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ia_recruiter}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-changeme_minio_secret}
      MINIO_BUCKET_RESUMES: ${MINIO_BUCKET_RESUMES:-resumes}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-rabbit}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-changeme_rabbit_password}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL_EXTRACTION: ${ANTHROPIC_MODEL_EXTRACTION:-claude-haiku-4-5-20251001}
      ANTHROPIC_MODEL_MATCHING: ${ANTHROPIC_MODEL_MATCHING:-claude-haiku-4-5-20251001}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
    ports:
      - "8080:8080"
    networks:
      - ia_net

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: ia_recruiter_web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    networks:
      - ia_net

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:

networks:
  ia_net:
    driver: bridge
